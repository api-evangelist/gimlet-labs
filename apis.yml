aid: gimlet-labs
name: Gimlet Labs
description: >-
  Gimlet Labs is an applied research lab building high-performance AI
  infrastructure — inference systems, schedulers, and compilers optimized for
  agentic and multimodal AI workloads across heterogeneous hardware. Its
  products include Gimlet Cloud, an agent-native serverless managed inference
  cloud for deploying single- and multi-agent systems that combine LLMs,
  multimodal and diffusion models, code sandboxes, web search, and custom data
  sources with automatic scaling; and kforge, a tool that autonomously generates
  optimized low-level PyTorch kernels across CUDA, ROCm, and Metal backends
  (NVIDIA, AMD, Intel, Apple) without manual kernel writing. The lab's research
  spans autonomous kernel generation, SLA-aware scheduling of multi-stage agent
  workloads across datacenters, edge/cloud workload partitioning, an MLIR-based
  universal AI compiler, headless DPU/accelerator hardware architectures, and
  cost-aware optimization for multitenant environments. Gimlet Labs is backed by
  Menlo Ventures. As of mid-2026 the developer surface is largely pre-launch,
  with a waitlist and access-gated documentation; no public OpenAPI, SDKs, or
  MCP server were found during enrichment.
